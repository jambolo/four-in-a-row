[package]
name = "four-in-a-row"
version = "1.0.0"
edition = "2024"
description = "Tauri shell: owns the window and exposes the Four In A Row game core to the web UI."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
four-in-a-row-core = { path = "../src-core" }

[dev-dependencies]
serde_json = "1"
